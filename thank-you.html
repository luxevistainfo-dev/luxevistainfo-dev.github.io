<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you — Pawlight</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="index.html"><img src="images/mark.jpg" alt=""> Pawlight</a>
      <a class="btn btn-gold" href="index.html#donate">Give again</a>
    </div>
  </header>
  <section class="hero" style="min-height:70vh">
    <img class="bg" src="images/after.jpg" alt="A dog running through a meadow">
    <div class="hero-grain"></div>
    <div class="hero-glow"></div>
    <div class="wrap hero-copy">
      <p class="eyebrow">You did something small and complete</p>
      <h1><span class="line"><span>Thank you.</span></span></h1>
      <p class="lede">If you sent $1, a bowl can be filled. If you sent more, more nights get easier. We do not need a speech from you. We are grateful you treated a stray’s hunger as real.</p>
      <div class="hero-actions">
        <a class="btn btn-gold" id="share-x" target="_blank" rel="noopener">Tell one person</a>
        <a class="btn btn-ghost" href="index.html">Back to Pawlight</a>
      </div>
    </div>
  </section>
  <div class="toast" id="toast"></div>
  <script src="js/main.js"></script>
</body>
</html>
